server:
  addr: ":8080"
  read_timeout: "5s"
  write_timeout: "10s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"
  max_body_bytes: 1048576
  # Cap concurrent webhook processing; excess is shed with 503 + Retry-After
  # before any body is buffered. 0 (or omit) means unlimited.
  max_inflight_requests: 256
  # Cap concurrent fan-out publishes per webhook request. 0 (or omit) defaults
  # to 8 workers.
  fanout_concurrency: 8

security:
  # Honor X-Forwarded-For / X-Real-IP, but only from the trusted proxy ranges
  # below, so clients can't spoof their source IP to bypass the allowlist or
  # rate limit. Set trusted_proxies to your load balancer/ingress CIDRs.
  # If clients reach Hookway directly (no proxy), set this to false instead.
  trusted_proxy_headers: true
  trusted_proxies:
    - "10.0.0.0/8"
    - "192.168.0.0/16"
  request_id_header: "X-Request-ID"
  redacted_header_denylist:
    - "Authorization"
    - "Cookie"
    - "Paddle-Signature"
    - "X-Hub-Signature-256"
  # Optional fail-safe: forward ONLY these headers to the queue and logs; every
  # other header is dropped. Omit this block to keep the legacy denylist behavior.
  forwarded_header_allowlist:
    - "Content-Type"
    - "X-Request-ID"

rate_limit:
  enabled: true
  requests_per_minute: 120
  burst: 20
  key_by: "ip"

metrics:
  enabled: true
  path: "/metrics"
  # Serve metrics on a private port so /metrics is not exposed on the public
  # webhook listener. Scrape this from inside the cluster only. Omit to mount
  # /metrics on the main server port.
  addr: ":9090"
  # Go runtime + process CPU/memory collectors (go_goroutines, heap/GC,
  # process_cpu_seconds_total, process_resident_memory_bytes). Default true;
  # set false if your platform (e.g. cAdvisor) already collects container CPU/mem.
  runtime_metrics: true

message_queues:
  primary:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.webhooks"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true
      # Publish concurrency: pool of confirm channels. Default is 8; raise it if a
      # single broker round-trip per request becomes the throughput ceiling.
      publisher_channels: 8
      # Default queue arguments applied to endpoint queues Hookway declares.
      # Destination route queue_options can override these when a webhook source
      # needs different retention/backlog limits.
      queue_defaults:
        # Drop stale webhook deliveries after this much time in queue. RabbitMQ
        # receives this as x-message-ttl in milliseconds.
        message_ttl: "24h"
        # Bound queue growth so a broken consumer cannot fill the broker.
        max_length: 100000
        # For webhooks, reject new publishes when full so providers retry instead
        # of silently discarding older queued deliveries.
        overflow: "reject-publish"
      # TLS options for amqps:// brokers. Omit entirely for brokers with publicly
      # trusted certs (e.g. CloudAMQP) — the image ships the system CA bundle.
      # Configure only for private CAs, mutual TLS, or a custom server name.
      # tls:
      #   ca_cert: "/etc/hookway/ca.pem"
      #   client_cert: "/etc/hookway/tls.crt"
      #   client_key: "/etc/hookway/tls.key"
      #   server_name: "rabbitmq.internal"
      #   insecure_skip_verify: false
      dead_letter:
        enabled: true
        exchange: "hookway.webhooks.dlx"
        exchange_type: "direct"
        queue: "hookway.webhooks.dlq"
        routing_key: "webhooks.dead"
        durable: true
        create_queue: true
  audit:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.audit"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true
      publisher_channels: 4

endpoints:
  paddle_billing:
    enabled: true
    path: "/webhooks/paddle"
    destinations:
      - destination_queue_id: "primary"
        queue: "paddle-webhooks"
        create_queue: true
        queue_options:
          # Billing events matter more than generic activity events; keep them
          # longer and allow a deeper backlog than the RabbitMQ defaults.
          message_ttl: "72h"
          max_length: 500000
          dead_letter_routing_key: "paddle.dead"
      - destination_queue_id: "audit"
        queue: "paddle-audit-webhooks"
        create_queue: true
        queue_options:
          message_ttl: "168h"
    max_body_bytes: 2097152
    rate_limit:
      enabled: true
      requests_per_minute: 500
      burst: 1000
      key_by: "ip"
    replay_protection:
      enabled: true
      ttl: "10m"
      max_entries: 50000
    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_ts_colon"
      secret: "${PADDLE_WEBHOOK_SECRET}"
      signature_header: "Paddle-Signature"
      timestamp_tolerance: "5m"
      # No idempotency_header: Paddle has no stable per-delivery header (the
      # event id is in the JSON body), so Hookway derives the envelope
      # idempotency_key from a hash of the verified signature, which is stable
      # across Paddle's retries of the same event.
  github_events:
    enabled: true
    path: "/webhooks/github"
    destinations:
      - destination_queue_id: "primary"
        queue: "github-webhooks"
        create_queue: true
    max_body_bytes: 2097152
    rate_limit:
      enabled: true
      requests_per_minute: 500
      burst: 1000
      key_by: "ip"
    replay_protection:
      enabled: true
      ttl: "10m"
      max_entries: 50000
    auth:
      type: "hmac_sha256"
      # GitHub signs the raw body with no timestamp, so it uses the
      # hmac_sha256_hex scheme rather than a timestamped layout.
      scheme: "hmac_sha256_hex"
      secret: "${GITHUB_WEBHOOK_SECRET}"
      signature_header: "X-Hub-Signature-256"
      # GitHub sends a stable delivery UUID consumers can dedupe on.
      idempotency_header: "X-GitHub-Delivery"

  # RevenueCat sends a static Authorization header you configure in the dashboard.
  # Set REVENUECAT_WEBHOOK_AUTH to the token value when remove_bearer is true.
  revenuecat_billing:
    enabled: false
    path: "/webhooks/revenuecat"
    destinations:
      - destination_queue_id: "primary"
        queue: "revenuecat-events"
        create_queue: true
    max_body_bytes: 2097152
    auth:
      type: "header_exact"
      scheme: "exact"
      secret: "${REVENUECAT_WEBHOOK_AUTH}"
      signature_header: "Authorization"
      remove_bearer: true
    replay_protection:
      enabled: true
      ttl: "10m"
      max_entries: 50000
    rate_limit:
      enabled: true
      requests_per_minute: 500
      burst: 1000
      key_by: "ip"

  # Stripe: timestamped HMAC-SHA256 signature in Stripe-Signature header.
  # Set STRIPE_WEBHOOK_SECRET to the whsec_... value from the Stripe dashboard.
  # stripe_billing:
  #   enabled: false
  #   path: "/webhooks/stripe"
  #   destinations:
  #     - destination_queue_id: "primary"
  #       queue: "stripe-events"
  #       create_queue: true
  #   max_body_bytes: 2097152
  #   auth:
  #     type: "hmac_sha256"
  #     scheme: "hmac_sha256_ts_dot"
  #     secret: "${STRIPE_WEBHOOK_SECRET}"
  #     signature_header: "Stripe-Signature"
  #     timestamp_tolerance: "5m"
  #   replay_protection:
  #     enabled: true
  #     ttl: "10m"
  #     max_entries: 50000
  #   rate_limit:
  #     enabled: true
  #     requests_per_minute: 500
  #     burst: 1000
  #     key_by: "ip"

  # Basic auth: HTTP Basic Authorization header (base64-encoded user:pass).
  # Set BASIC_WEBHOOK_SECRET to "user:pass" matching the provider's credentials.
  # basic_webhook:
  #   enabled: false
  #   path: "/webhooks/basic"
  #   destinations:
  #     - destination_queue_id: "primary"
  #       queue: "basic-events"
  #       create_queue: true
  #   max_body_bytes: 2097152
  #   auth:
  #     type: "header_exact"
  #     scheme: "basic"
  #     secret: "${BASIC_WEBHOOK_SECRET}"
  #     signature_header: "Authorization"
  #   replay_protection:
  #     enabled: true
  #     ttl: "10m"
  #     max_entries: 50000
  #   rate_limit:
  #     enabled: true
  #     requests_per_minute: 500
  #     burst: 1000
  #     key_by: "ip"

  # JWT RS256: Bearer token signed with an RSA private key; Hookway verifies with
  # the matching public key. The alg header is pinned to RS256 — algorithm-confusion
  # attacks (e.g. signing HS256 with the public key bytes) are rejected at startup.
  # Set JWT_PUBLIC_KEY to the PEM-encoded RSA public key from your identity provider.
  # Optional: expected_issuer / expected_audience enforce iss/aud claims.
  # Optional: body_hash_claim binds the token to the exact request body (hex SHA-256).
  # jwt_webhook:
  #   enabled: false
  #   path: "/webhooks/jwt"
  #   destinations:
  #     - destination_queue_id: "primary"
  #       queue: "jwt-events"
  #       create_queue: true
  #   max_body_bytes: 2097152
  #   auth:
  #     type: "jwt"
  #     scheme: "jwt_rs256"
  #     secret: "${JWT_PUBLIC_KEY}"
  #     signature_header: "Authorization"
  #     timestamp_tolerance: "1m"
  #     expected_issuer: "https://your-idp.example.com"
  #     expected_audience: "hookway"
  #     body_hash_claim: "body_sha256"
  #   replay_protection:
  #     enabled: true
  #     ttl: "10m"
  #     max_entries: 50000
  #   rate_limit:
  #     enabled: true
  #     requests_per_minute: 500
  #     burst: 1000
  #     key_by: "ip"

