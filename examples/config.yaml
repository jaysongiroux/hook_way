server:
  addr: ":8080"
  max_body_bytes: 1048576

destinations:
  primary:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.webhooks"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true

endpoints:
  github_events:
    enabled: true
    path: "/webhooks/github"
    # Defaults to stop_on_failure. Use skip_failed only when partial delivery is OK.
    # delivery_failure_policy: "stop_on_failure"
    destinations:
      - destination: "primary"
        target: "github-webhooks"
        create: true

    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_hex"
      secret: "${GITHUB_WEBHOOK_SECRET}"
      signature_header: "X-Hub-Signature-256"
