services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  hookway:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      - rabbitmq
    ports:
      - "8080:8080"
    environment:
      HOOKWAY_CONFIG: /etc/hookway/config.yaml
      # Both fall back to a working dev default, so `make dev-up` needs no
      # setup. Exporting either variable before `make dev-up` overrides it --
      # note the RabbitMQ host must be `rabbitmq` (the compose service name),
      # not `localhost`, because the URL is resolved inside the container.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-change-me}
    volumes:
      - ./config.yaml:/etc/hookway/config.yaml:ro
