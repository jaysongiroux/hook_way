# Replay and console for the disposable event demo.
server:
  addr: ":8080"
  cors:
    allowed_origins: ["http://localhost:18082"]
logging:
  level: info
metrics:
  enabled: false
  path: /metrics
  addr: ":9091"
database:
  url: "${EVENT_DATABASE_URL}"
  max_conns: 10
core:
  control_url: "http://core:9092"
  control_token: "${REPLAY_CONTROL_TOKEN}"
retention:
  ttl: 168h
  max_records: 100000
  max_bytes: 10737418240
  max_record_bytes: 16777216
  gc_interval: 15m
workers:
  concurrency: 4
  execution_timeout: 30s
  lease: 60s
keys:
  - name: core
    token: "${REPLAY_CAPTURE_TOKEN}"
    scopes: [capture]
  - name: operator
    token: "${REPLAY_OPERATOR_TOKEN}"
    scopes: [read, payload, retry, events_read, events_payload, events_retry, events_manage]
