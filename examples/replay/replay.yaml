# Replay service half of the replay example (docker-compose.yaml in this
# directory). Both replay replicas and the one-shot migration use this file.
# Demonstrates shared failure storage and coordinated retry workers across
# two replay replicas, with bounded retention and separate capture, operator
# and metrics keys. Every setting is described in docs/operations/replay-service.md.
server:
  addr: ":8080"
  cors:
    allowed_origins: ["${REPLAY_CONSOLE_ORIGIN}"]
logging:
  level: info
metrics:
  enabled: true
  path: /metrics
  addr: ":9091"
database:
  url: "${REPLAY_DATABASE_URL}"
  max_conns: 10
core:
  # The "core" service name round-robins across both core replicas.
  control_url: "http://core:9092"
  control_token: "${REPLAY_CONTROL_TOKEN}"
retention:
  ttl: 168h
  max_records: 100000
  max_bytes: 10737418240
  max_record_bytes: 16777216
  gc_interval: 15m
workers:
  concurrency: 4
  execution_timeout: 30s
  lease: 60s
keys:
  - name: core
    token: "${REPLAY_CAPTURE_TOKEN}"
    scopes: [capture]
  - name: operator
    token: "${REPLAY_OPERATOR_TOKEN}"
    scopes: [read, payload, retry]
  # Prometheus scrapes with its own key: the scrape credential must not also
  # download payloads or trigger redrives.
  - name: prometheus
    token: "${REPLAY_METRICS_TOKEN}"
    scopes: [metrics]
