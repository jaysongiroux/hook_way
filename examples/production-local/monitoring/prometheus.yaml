global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: hookway-core
    authorization:
      credentials_file: /etc/prometheus/core-token
    static_configs:
      - targets: [hookway:9090]
  # One job represents one shared replay database; replicas belong in this list.
  # For core-only mode remove this job in your private copy, not its auth guard.
  - job_name: hookway-replay
    authorization:
      credentials_file: /etc/prometheus/replay-token
    static_configs:
      - targets: [replay:9091]
