# Synchronous proxy flow used by the Chunk 6 verification gate.
# DIGIFI_BASE should have no trailing slash (e.g. http://127.0.0.1:9999).
# SF_TOKEN is compared to the inbound X-Auth header.
schema_version: 2
server:
  addr: ":8080"
  max_body_bytes: 10485760

destinations: {}

flows:
  salesforce_proxy:
    nodes:
      - {id: in, type: http_trigger, path: "/salesforce/proxy/{rest...}", methods: [ANY]}
      - {id: body, type: read_body, max_bytes: 10485760}
      - {id: auth, type: auth, scheme: exact, secret: "${SF_TOKEN}", signature_header: X-Auth}
      - {id: env, type: envelope, body_format: raw}
      - {id: up, type: http_request, url: "${DIGIFI_BASE}/{rest}", forward_method: true, forward_query: true}
      - {id: resp, type: respond, passthrough: true}
    edges: [in>body, body>auth, auth>env, env>up, up>resp]
