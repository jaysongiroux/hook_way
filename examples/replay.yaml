server:
  addr: ":8080"
  max_body_bytes: 1048576

security:
  api_key: "${REPLAY_API_KEY}"

destinations:
  primary:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.webhooks"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true

endpoints:
  github_events:
    enabled: true
    path: "/webhooks/github"
    destinations:
      - destination: "primary"
        target: "github-webhooks"
        create: true

    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_hex"
      secret: "${GITHUB_WEBHOOK_SECRET}"
      signature_header: "X-Hub-Signature-256"

# Webhook-replay: captures every accepted event into Postgres and serves a
# protected API (on its own listener) to list/inspect/re-deliver them. See
# docs/configuration.md § Replay and docs/security.md § Replay.
replay:
  enabled: true
  addr: ":9091"
  skip_unauthenticated: true
  ttl: 168h
  max_events: 1000000
  cleanup_interval: 1h
  postgres:
    url: ${REPLAY_DB_URL}
