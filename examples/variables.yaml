# examples/variables.yaml
#
# Reference config for routing VARIABLES: per-request values that fill {name}
# placeholders in publish targets and in a webhook destination url.
#
# The scenario: one Hookway instance in front of several environments
# (qa-gm3, staging-portal, portal, ...). DigiFi is given one webhook URL per
# environment, e.g. https://hooks.example.com/webhooks/qa-gm3/digifi, and each
# event lands in that environment's queue and Hub.
#
# Path placeholders on http_trigger (e.g. {envName}) are copied onto
# envelope.Vars automatically. Body fields can be copied with a transform
# field_map node. Unresolved templates fail closed at publish.

server:
  addr: ":8080"
  max_body_bytes: 1048576

destinations:
  archive:
    type: s3
    s3:
      region: "us-east-1"
      bucket: "${ARCHIVE_BUCKET}"
  hub:
    type: webhook
    webhook:
      # The host is templated. A placeholder in the host must be followed by a
      # literal domain suffix so a request can never choose an arbitrary host.
      # The route target is appended as the final path segment.
      url: "https://{envName}-api.htap.sh/api/v3/digifi/webhook"
      timeout: "10s"
      auth:
        type: "api_key"
        header: "Authorization"
        value: "${HUB_API_KEY}"
  audit:
    type: mongodb
    mongodb:
      uri: "${MONGODB_URI}"
      database: "webhooks"

flows:
  digifi:
    nodes:
      - {id: in, type: http_trigger, path: "/webhooks/{envName}/digifi", methods: [POST]}
      - {id: body, type: read_body, max_bytes: 1048576}
      - {id: auth, type: auth, scheme: exact, secret: "${DIGIFI_WEBHOOK_TOKEN}", signature_header: X-DigiFi-Token}
      - {id: env, type: envelope, body_format: json}
      - id: map
        type: transform
        kind: field_map
        mappings:
          - from: body.data.object.organizationId
            to: vars.tenant
      # envName is a path var; tenant is filled by field_map. Unresolved
      # templates fail closed at publish. There is no archive/unrouted fallback.
      # DynamoDB lookup variable envByApp is omitted until the lookup node grows
      # those fields (index, filter, value_attribute, region).
      - {id: out_archive, type: publish, destination: archive, target: "{envName}-events"}
      - {id: out_hub, type: publish, destination: hub, target: event}
      - {id: out_audit, type: publish, destination: audit, target: "{envName}-{tenant}"}
    edges: [in>body, body>auth, auth>env, env>map, map>out_archive, map>out_hub, map>out_audit]
