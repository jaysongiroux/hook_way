# examples/destinations/redis_kv.yaml
#
# Reference config for a Redis / Valkey key-value destination (redis_kv).
#
# redis_kv stores each webhook payload as a JSON-encoded string under a
# computed Redis key via SET (with EX for TTL-bounded expiry). This is a
# key-value store, NOT a queue:
#   - Each write overwrites the previous value at that key.
#   - The TTL bounds the keyspace so old entries expire automatically.
#   - There is no consumer group, ordering guarantee, or replay capability.
#
# Best for: idempotency-key stores, latest-event caches, deduplication
# sidecars, and ephemeral state where only the most recent payload matters.
# For durable, ordered delivery use redis_stream or redis_list instead.
#
# Key template:
#   redis_options.key_template controls how the storage key is built.
#   Supported tokens (literal {…} substitution):
#     {prefix}          → the redis.key_prefix value (requires redis.key_prefix
#                         to be set; renders as "" when key_prefix is absent)
#     {target}          → the route target name (the "target:" field below)
#     {endpoint}        → the endpoint name (the enclosing endpoints key)
#     {id}              → the event id (msg.ID)
#     {idempotency_key} → the idempotency key (msg.IdempotencyKey)
#   Unknown tokens are left as-is in the rendered key.
#   Default template when key_template is omitted: "{prefix}:{endpoint}:{id}"
#   Example: "{prefix}:{endpoint}:{id}" → "hookway:webhook_events:<event-id>"
#
# TTL:
#   redis_options.ttl sets the Redis key expiry (Go duration string).
#   Keys expire automatically after this duration. Size the TTL to match
#   your retention window — 168h (7 days) is a common starting point.
#   NOTE: ttl and key_template are ONLY valid for redis_kv. Both are
#   invalid for redis_stream, redis_list, and redis_pubsub.
#
# Valkey is fully supported; point redis.url at a Valkey node.

server:
  addr: ":8080"
  max_body_bytes: 1048576

destinations:
  events:
    type: redis_kv

    redis:
      # ── Single-node / proxy mode (default) ────────────────────────────────
      mode: single          # single | cluster | sentinel
      url: "${REDIS_URL}"   # redis:// or rediss:// URL; set REDIS_URL in env

      # ── Cluster mode (uncomment and populate addrs; remove url) ───────────
      # mode: cluster
      # addrs:
      #   - "redis-1:6379"
      #   - "redis-2:6379"
      #   - "redis-3:6379"

      # ── Sentinel mode (uncomment; remove url; set master_name) ────────────
      # mode: sentinel
      # addrs:
      #   - "sentinel-1:26379"
      #   - "sentinel-2:26379"
      # master_name: "mymaster"

      # ── Optional auth ─────────────────────────────────────────────────────
      # username: "${REDIS_USERNAME:-}"
      # password: "${REDIS_PASSWORD:-}"

      # ── Optional database index (single/sentinel only; cluster ignores it) ─
      # db: 0

      # ── Optional key prefix (substituted into {prefix} in key_template) ───
      # key_prefix: "hookway"

      # ── Optional TLS (required for rediss:// or private-CA servers) ───────
      # tls:
      #   enabled: false
      #   # For private / self-signed CAs:
      #   # ca_cert: "/etc/ssl/certs/redis-ca.pem"
      #   # Mutual TLS — both must be set together:
      #   # client_cert: "/etc/ssl/certs/redis-client.pem"
      #   # client_key:  "/etc/ssl/private/redis-client.key"
      #   # Override the server's SNI name:
      #   # server_name: "redis.internal"
      #   # Dev only — disables certificate verification; never use in production:
      #   # insecure_skip_verify: false

endpoints:
  # Webhook events stored as SET key-value pairs with a TTL. Each delivery
  # overwrites the key at that computed path; old entries expire automatically.
  webhook_events:
    enabled: true
    path: "/webhooks/events"
    destinations:
      - destination: "events"
        # Base name used as the {endpoint} placeholder in key_template. Must
        # match ^[a-zA-Z0-9._-]{1,128}$
        target: "webhooks.kv"
        # When true: at startup Hookway verifies the Redis connection is
        # reachable (idempotent — safe to leave enabled in production).
        create: true
        redis_options:
          # Key expiry duration (Go duration string). Keys are stored with SET
          # EX so they expire automatically after this window. Bounds the
          # keyspace and prevents unbounded growth. 168h = 7 days.
          # NOTE: ttl is ONLY valid for redis_kv destinations.
          ttl: "168h"
          # Template for the Redis storage key. Supported tokens:
          #   {prefix}          — redis.key_prefix (empty string if not set)
          #   {target}          — the route target name (the "target:" field above)
          #   {endpoint}        — the endpoint name (the enclosing endpoints key)
          #   {id}              — the event id (msg.ID)
          #   {idempotency_key} — the idempotency key (msg.IdempotencyKey)
          #   Unknown tokens are left as-is in the rendered key.
          # NOTE: key_template is ONLY valid for redis_kv destinations.
          key_template: "{prefix}:{endpoint}:{id}"
          # NOTE: max_len and consumer_group are NOT valid for redis_kv —
          # validation will reject them.
    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_hex"
      secret: "${WEBHOOK_SECRET}"
      signature_header: "X-Hub-Signature-256"
