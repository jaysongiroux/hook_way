# examples/destinations/rabbitmq.yaml
#
# Reference config showing the full RabbitMQ destination option surface.
# One endpoint fans out to two destinations: a primary exchange with dead-letter
# support and an audit exchange with minimal options.

server:
  addr: ":8080"
  read_timeout: "5s"
  write_timeout: "10s"
  idle_timeout: "60s"
  shutdown_timeout: "10s"
  max_body_bytes: 1048576
  # Cap concurrent webhook processing (0 = unlimited).
  max_inflight_requests: 256
  # Cap concurrent fan-out publishes per request (0 defaults to 8).
  fanout_concurrency: 8

destinations:
  primary:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.webhooks"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true
      # Publish concurrency: pool of confirm channels. Raise if broker
      # round-trips become the throughput ceiling.
      publisher_channels: 8
      # Default queue arguments applied to all queues declared by Hookway.
      # Per-route queue_options can override these individually.
      queue_defaults:
        # Drop stale deliveries after this much time in queue.
        # RabbitMQ receives this as x-message-ttl in milliseconds.
        message_ttl: "24h"
        # Bound queue growth so a broken consumer cannot fill the broker.
        max_length: 100000
        # Reject new publishes when full so providers retry instead of
        # silently discarding older queued messages.
        overflow: "reject-publish"
      # TLS for amqps:// brokers. Omit entirely for publicly trusted certs
      # (e.g. CloudAMQP) — the container ships the system CA bundle.
      # tls:
      #   ca_cert: "/etc/hookway/ca.pem"
      #   client_cert: "/etc/hookway/tls.crt"
      #   client_key: "/etc/hookway/tls.key"
      #   server_name: "rabbitmq.internal"
      #   insecure_skip_verify: false
      dead_letter:
        enabled: true
        exchange: "hookway.webhooks.dlx"
        exchange_type: "direct"
        queue: "hookway.webhooks.dlq"
        routing_key: "webhooks.dead"
        durable: true
        create_queue: true

  audit:
    type: "rabbitmq"
    rabbitmq:
      url: "${RABBITMQ_URL}"
      exchange: "hookway.audit"
      exchange_type: "direct"
      durable: true
      publish_timeout: "5s"
      declare_queues: true
      publisher_channels: 4

endpoints:
  paddle_billing:
    enabled: true
    path: "/webhooks/paddle"
    destinations:
      - destination: "primary"
        target: "paddle-webhooks"
        create: true
        queue_options:
          # Billing events are high value; keep them longer and allow a
          # deeper backlog than the global queue_defaults above.
          message_ttl: "72h"
          max_length: 500000
          dead_letter_routing_key: "paddle.dead"
      - destination: "audit"
        target: "paddle-audit-webhooks"
        create: true
        queue_options:
          message_ttl: "168h"
    max_body_bytes: 2097152
    rate_limit:
      enabled: true
      requests_per_minute: 500
      burst: 1000
      key_by: "ip"
    replay_protection:
      enabled: true
      ttl: "10m"
      max_entries: 50000
    auth:
      type: "hmac_sha256"
      # Paddle signs <timestamp>:<body> in the Paddle-Signature header.
      scheme: "hmac_sha256_ts_colon"
      secret: "${PADDLE_WEBHOOK_SECRET}"
      signature_header: "Paddle-Signature"
      timestamp_tolerance: "5m"
