# examples/destinations/sqs.yaml
#
# Reference config for an AWS SQS destination, showing both a FIFO queue
# (with ordering and deduplication options) and a standard queue.
# Credentials: omit access_key_id / secret_access_key to use the default
# AWS credential chain (IAM role, environment, ~/.aws). Set both to use
# static credentials, or set endpoint to http://localhost:4566 for LocalStack.

server:
  addr: ":8080"
  max_body_bytes: 1048576

destinations:
  jobs:
    type: sqs
    # How to handle an existing queue whose attributes differ from this config:
    #   reconcile (default): edit the queue's mutable attributes to match (needs sqs:SetQueueAttributes)
    #   warn: log the difference and use the existing queue unchanged
    #   error: fail startup on any difference
    # Immutable conflicts (FIFO vs standard) always fail startup regardless.
    on_existing_conflict: reconcile
    sqs:
      region: "us-east-1"
      # Uncomment to override the SQS endpoint, e.g. for LocalStack:
      # endpoint: "http://localhost:4566"   # or reference an env var you export
      # Omit both of the following to use the default AWS credential chain:
      # access_key_id: "AKIA..."
      # secret_access_key: "..."

endpoints:
  # FIFO queue: the .fifo suffix selects FIFO mode. A fifo: block is required
  # for FIFO targets and must define group_id (ordering key).
  orders:
    enabled: true
    path: "/webhooks/orders"
    destinations:
      - destination: "jobs"
        target: "orders-jobs.fifo"         # .fifo suffix → FIFO queue
        create: true                        # auto-create the queue at startup
        sqs_options:
          visibility_timeout: "30s"         # how long a consumer has to process
          message_retention: "96h"          # how long SQS retains undelivered messages
        fifo:
          group_id:
            # Route messages to the same group by customer id from the body.
            # source options: endpoint | static | header | body
            source: "body"
            path: "customer.id"
            # fallback: use when the path is absent — can be a literal or "endpoint"
            fallback: "endpoint"
          dedup:
            # Use the idempotency header from the provider as the dedup id when present.
            use_idempotency_key: true
            # Fall back to content-based deduplication when no idempotency id is available.
            content_based_fallback: true
    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_ts_colon"
      secret: "${ORDERS_WEBHOOK_SECRET}"
      signature_header: "X-Signature"
      timestamp_tolerance: "5m"

  # Standard (non-FIFO) queue: omit the .fifo suffix and the fifo: block.
  notifications:
    enabled: true
    path: "/webhooks/notifications"
    destinations:
      - destination: "jobs"
        target: "notification-jobs"
        create: true
        sqs_options:
          visibility_timeout: "60s"
          message_retention: "24h"
    auth:
      type: "hmac_sha256"
      scheme: "hmac_sha256_hex"
      secret: "${NOTIFY_WEBHOOK_SECRET}"
      signature_header: "X-Hub-Signature-256"
