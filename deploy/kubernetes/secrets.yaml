# Tokens and the database URL for core and the replay service. Replace every
# value before applying; generate each token with `openssl rand -hex 32`.
# The two services refuse tokens shorter than 32 characters.
apiVersion: v1
kind: Secret
metadata:
  name: hookway-replay-tokens
type: Opaque
stringData:
  capture-token: "replace-me-with-a-32-plus-character-capture-token"
  control-token: "replace-me-with-a-32-plus-character-control-token"
  operator-token: "replace-me-with-a-32-plus-character-operator-token"
  metrics-token: "replace-me-with-a-32-plus-character-metrics-token"
  database-url: "postgres://replay:replace-me@postgres.example.internal:5432/replay"
---
# The webhook signing secret core's example flow verifies.
apiVersion: v1
kind: Secret
metadata:
  name: hookway-webhook-secrets
type: Opaque
stringData:
  orders: "replace-me-with-the-senders-signing-secret"
