# Core's control listener accepts only the replay service; the replay API —
# including the capture endpoint — accepts only core and operator clients
# (pods labelled hookway-replay-client: "true"). Metrics ports stay open to
# the cluster; narrow them to your Prometheus namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hookway-core
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: hookway-core}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8080}
        - {port: 9090}
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: hookway-replay}
      ports:
        - {port: 9092}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hookway-replay
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: hookway-replay}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: hookway-core}
        - podSelector:
            matchLabels: {hookway-replay-client: "true"}
      ports:
        - {port: 8080}
    - ports:
        - {port: 9091}
