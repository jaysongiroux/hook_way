# The replay service: two replicas sharing one PostgreSQL database. Apply
# replay-config.yaml and run migrate-job.yaml before deploying this file;
# serve refuses to start on an older schema.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hookway-replay
  labels: {app.kubernetes.io/name: hookway-replay}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: hookway-replay}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hookway-replay}
    spec:
      # Longer than workers.execution_timeout, so in-flight runs finalize.
      terminationGracePeriodSeconds: 45
      containers:
        - name: replay
          image: hookway-replay:latest
          args: ["serve", "--config", "/etc/hookway-replay/replay.yaml"]
          env:
            - name: REPLAY_DATABASE_URL
              valueFrom: {secretKeyRef: {name: hookway-replay-tokens, key: database-url}}
            - name: REPLAY_CONTROL_TOKEN
              valueFrom: {secretKeyRef: {name: hookway-replay-tokens, key: control-token}}
            - name: REPLAY_CAPTURE_TOKEN
              valueFrom: {secretKeyRef: {name: hookway-replay-tokens, key: capture-token}}
            - name: REPLAY_OPERATOR_TOKEN
              valueFrom: {secretKeyRef: {name: hookway-replay-tokens, key: operator-token}}
            - name: REPLAY_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: hookway-replay-tokens, key: metrics-token}}
          ports:
            - {name: api, containerPort: 8080}
            - {name: metrics, containerPort: 9091}
          readinessProbe:
            httpGet: {path: /readyz, port: api}
          livenessProbe:
            httpGet: {path: /healthz, port: api}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/hookway-replay, readOnly: true}
      volumes:
        - name: config
          configMap: {name: hookway-replay}
---
apiVersion: v1
kind: Service
metadata:
  name: hookway-replay
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: hookway-replay}
  ports:
    - {name: api, port: 8080, targetPort: api}
