# Cut a release from an existing v* tag. Re-runs CI, then publishes the
# Docker Hub images — core, and the replay service as `<image>-replay` —
# (semver + latest for non-prereleases), syncs the Hub description, and opens
# a GitHub Release. Pushes to main do not publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (e.g. v1.2.3)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Release context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.out.outputs.tag }}
      prerelease: ${{ steps.out.outputs.prerelease }}
    steps:
      - id: out
        env:
          EVENT: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          else
            tag="$REF_NAME"
          fi
          tag="${tag#refs/tags/}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1 (got: $tag)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks
    needs: context
    uses: ./.github/workflows/reusable-ci.yml
    with:
      ref: ${{ needs.context.outputs.tag }}

  publish:
    name: Publish
    needs: [context, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
      DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_IMAGE_NAME }}
      TAG: ${{ needs.context.outputs.tag }}
      PRERELEASE: ${{ needs.context.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: make web-install

      # Dockerfile COPYs the staged embed bundle; without this the published
      # image's editor is the placeholder page.
      - name: Build UI (WASM + SPA)
        run: make ui

      - name: Check UI is staged
        run: make ui-check

      - name: Check Docker Hub publishing config
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing GitHub Actions secret DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_NAMESPACE" || (echo "Missing GitHub Actions secret DOCKERHUB_NAMESPACE" && exit 1)
          test -n "$DOCKERHUB_IMAGE_NAME" || (echo "Missing GitHub Actions secret DOCKERHUB_IMAGE_NAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing GitHub Actions secret DOCKERHUB_TOKEN" && exit 1)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.PRERELEASE == 'false' }}

      - name: Resolve build version/commit
        id: build-info
        # Mirrors the Makefile's VERSION/COMMIT so the pushed image's
        # hookway_build_info and `hookway version` match a local `make
        # docker-build` for the same commit.
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: core
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            COMMIT=${{ steps.build-info.outputs.commit }}

      - name: Docker metadata (replay)
        id: docker-meta-replay
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_IMAGE_NAME }}-replay
          tags: |
            type=semver,pattern={{raw}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ env.PRERELEASE == 'false' }}

      - name: Push replay Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: replay
          push: true
          tags: ${{ steps.docker-meta-replay.outputs.tags }}
          labels: ${{ steps.docker-meta-replay.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            COMMIT=${{ steps.build-info.outputs.commit }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          readme-filepath: ./docs/dockerhub/README.md
          short-description: ${{ github.event.repository.description }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
            exit 0
          fi
          extra=(--generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          gh release create "$TAG" "${extra[@]}"
