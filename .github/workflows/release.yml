name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
  DOCKERHUB_IMAGE_NAME: ${{ secrets.DOCKERHUB_IMAGE_NAME }}

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Validate example configs
        run: make validate-examples

      - name: Unit tests
        run: make test

      - name: Race tests
        run: make test-race

      - name: RabbitMQ integration tests
        run: make integration-test

      - name: AWS integration tests (LocalStack)
        run: make aws-integration-test

      - name: Redis integration tests (testcontainers)
        run: make redis-integration-test

      - name: Postgres integration tests (testcontainers)
        run: make postgres-integration-test

      - name: MongoDB integration tests (testcontainers)
        run: make mongodb-integration-test

      - name: Kafka integration tests (testcontainers)
        run: make kafka-integration-test

      - name: Webhook integration tests (testcontainers)
        run: make webhook-integration-test

      - name: Temporal integration tests (testcontainers)
        run: make temporal-integration-test

      - name: Replaystore integration tests (testcontainers)
        run: make replaystore-integration-test

      - name: Vet
        run: make lint

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web deps
        run: make web-install

      - name: Web unit tests
        run: make web-test

      - name: Build UI (WASM + SPA)
        run: make ui

      - name: Docker build
        run: make docker-build

      - name: Vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hookway:local
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload vulnerability scan artifact
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.trivy.outcome != 'skipped' }}
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Check Docker Hub publishing config
        if: github.event_name != 'pull_request'
        run: |
          test -n "$DOCKERHUB_USERNAME" || (echo "Missing GitHub Actions secret DOCKERHUB_USERNAME" && exit 1)
          test -n "$DOCKERHUB_NAMESPACE" || (echo "Missing GitHub Actions secret DOCKERHUB_NAMESPACE" && exit 1)
          test -n "$DOCKERHUB_IMAGE_NAME" || (echo "Missing GitHub Actions secret DOCKERHUB_IMAGE_NAME" && exit 1)
          test -n "$DOCKERHUB_TOKEN" || (echo "Missing GitHub Actions secret DOCKERHUB_TOKEN" && exit 1)
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name != 'pull_request'
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{raw}}

      - name: Resolve build version/commit
        if: github.event_name != 'pull_request'
        id: build-info
        # Mirrors the Makefile's VERSION/COMMIT so the pushed image's
        # hookway_build_info and `hookway version` match a local `make
        # docker-build` for the same commit.
        run: |
          echo "version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build-info.outputs.version }}
            COMMIT=${{ steps.build-info.outputs.commit }}

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.DOCKERHUB_IMAGE_NAME }}
          readme-filepath: ./docs/dockerhub/README.md
          short-description: ${{ github.event.repository.description }}
