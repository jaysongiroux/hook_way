# Called by CI (PRs / main) and Release. Does not publish anything.
#
# The gate runs in three stages, each waiting for every job of the one before:
#
#   1. Lint     formatting, golangci-lint, govulncheck, static checks, web lint
#   2. Test     Go unit + conformance, race, examples, web unit, coverage,
#               observability
#   3. Deploy   Playwright, every integration suite (including the Compose
#               end-to-end run), image build + Trivy
#
# A failed job skips every later stage, so a lint error costs minutes, not a
# full integration run. Jobs inside a stage run in parallel.
name: Reusable CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (release tag). Empty uses checkout defaults for the event.
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"
  NODE_VERSION: "20"

jobs:
  # ── Stage 1: lint ────────────────────────────────────────────────────────

  formatting:
    name: Formatting
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt and whitespace
        run: make fmt-check diff-check

  golangci:
    name: golangci-lint
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vulnerability check
        run: make govulncheck

  static:
    name: Static checks
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: make lint

      - name: Module tidiness
        run: go mod tidy -diff

      - name: Documentation links
        run: make docs-check

      - name: Dead code
        run: make deadcode

  web-lint:
    name: Web lint
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: make web-install

      - name: Web dependency vulnerability gate
        run: cd web && npm audit --audit-level=high

      - name: Release policy checks
        run: |
          python3 scripts/check-release-policy.py
          bash -n scripts/verify-release.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/*.yml

      - name: Frontend hosting configuration tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s web/tests -p 'test_*.py'

      - name: Generated UI contract drift
        run: make node-schema-check api-schema-check

      - name: Independent UI builds
        run: make web-build console-build

      - name: Web dead code (knip)
        run: make web-knip

  # ── Stage 2: test ────────────────────────────────────────────────────────

  go:
    name: Go
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Unit tests
        run: make unit

      - name: Invariant conformance
        run: make conformance

  go-race:
    name: Go race
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Race tests
        run: make race

  examples:
    name: Examples
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Validate example configs
        run: make validate-examples

      - name: Serve and POST every example flow
        run: make test-examples

  web:
    name: Web
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: make web-install

      - name: Web unit tests
        run: make web-test

  coverage:
    name: Coverage
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Coverage floor
        run: make coverage

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error

  observability:
    name: Observability
    needs: [formatting, golangci, govulncheck, static, web-lint]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Monitoring assets and workflow tests
        run: make observability-check

  # ── Stage 3: deploy (browsers, containers, images) ───────────────────────

  web-e2e:
    name: Web e2e
    needs: [go, go-race, examples, web, coverage, observability]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: make web-install

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        # OS libraries are provisioned on the self-hosted runner. --with-deps
        # invokes sudo, which is intentionally unavailable to CI jobs.
        run: cd web && npx playwright install chromium

      - name: Playwright builder tests
        run: make web-e2e

      - name: Operational console and real PostgreSQL browser tests
        run: |
          make console-e2e
          HOOKWAY_CONSOLE_ACCEPTANCE=1 HOOKWAY_REQUIRE_INTEGRATION=1 go test ./cmd/hookway-replay -run TestServeEmbeddedConsole -count=1

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  integration:
    name: ${{ matrix.name }}
    needs: [go, go-race, examples, web, coverage, observability]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RabbitMQ
            target: integration-test
          - name: AWS
            target: aws-integration-test
          - name: Redis
            target: redis-integration-test
          - name: Postgres
            target: postgres-integration-test
          - name: MongoDB
            target: mongodb-integration-test
          - name: Kafka
            target: kafka-integration-test
          - name: Webhook
            target: webhook-integration-test
          - name: Temporal
            target: temporal-integration-test
          - name: Replay
            target: replay-integration-test
          - name: Replay acceptance
            target: replay-acceptance-test
          - name: Compose end-to-end
            target: compose-e2e-test COMPOSE_E2E_BUILD=dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: ${{ matrix.name }} integration tests
        env:
          HOOKWAY_REQUIRE_INTEGRATION: "1"
        run: make ${{ matrix.target }}

  image:
    name: Image
    needs: [go, go-race, examples, web, coverage, observability]
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Docker build
        run: make docker-build

      - name: Smoke-run the images
        run: |
          docker run --rm hookway:local version
          docker run --rm hookway-replay:local version
          python3 - <<'PYSMOKE'
          import importlib.util, subprocess
          spec = importlib.util.spec_from_file_location('smoke', 'scripts/release-smoke.py')
          smoke = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(smoke)
          version = subprocess.check_output(['git', 'describe', '--tags', '--always', '--dirty'], text=True).strip()
          commit = subprocess.check_output(['git', 'rev-parse', '--short', 'HEAD'], text=True).strip()
          smoke.console_install('hookway-console:local', version, commit)
          PYSMOKE

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway:local
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Vulnerability scan (replay)
        # Scan the replay image even when core's scan found something.
        if: success() || failure()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway-replay:local
          format: sarif
          output: trivy-replay-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload replay vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-replay-results
          path: trivy-replay-results.sarif
          if-no-files-found: error
      - name: Vulnerability scan (console)
        # Scan the console image even when core's scan found something.
        if: success() || failure()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway-console:local
          format: sarif
          output: trivy-console-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload console vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-console-results
          path: trivy-console-results.sarif
          if-no-files-found: error

  # Single required check for branch protection. Adding jobs above does not
  # require updating the protected-branch settings if this name stays stable.
  # A skipped job means an earlier stage failed, so it counts as a failure.
  success:
    name: All checks passed
    if: ${{ !cancelled() }}
    needs:
      - formatting
      - golangci
      - govulncheck
      - static
      - web-lint
      - go
      - go-race
      - examples
      - web
      - coverage
      - observability
      - web-e2e
      - integration
      - image
    runs-on: [self-hosted, Linux, X64, debian]
    steps:
      - name: Fail if any required job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
