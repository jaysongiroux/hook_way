# Scheduled vulnerability gates on main. Not a merge blocker; CI still runs
# Trivy on every PR. Code-scanning upload is best-effort if Advanced Security
# is not enabled.
name: Security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "web/Dockerfile"
      - "web/package-lock.json"
      - ".github/workflows/security.yml"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    name: Image scan
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Docker build
        run: make docker-build

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway:local
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-core

      - name: Vulnerability scan (replay)
        # Scan the replay image even when core's scan found something.
        if: success() || failure()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway-replay:local
          format: sarif
          output: trivy-replay-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload replay vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-replay-results
          path: trivy-replay-results.sarif
          if-no-files-found: error

      - name: Upload replay SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-replay-results.sarif
          category: trivy-replay

      - name: Vulnerability scan (console)
        # Scan the console image even when core's scan found something.
        if: success() || failure()
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hookway-console:local
          format: sarif
          output: trivy-console-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload console vulnerability scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-console-results
          path: trivy-console-results.sarif
          if-no-files-found: error

      - name: Upload console SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-console-results.sarif
          category: trivy-console

  web-audit:
    name: Web dependency audit
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: cd web && npm ci && npm audit --audit-level=high
