# Scheduled vulnerability gates on main. Not a merge blocker; CI still runs
# Trivy on every PR. Code-scanning upload is best-effort if Advanced Security
# is not enabled.
name: Security

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "web/package-lock.json"
      - ".github/workflows/security.yml"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  image:
    name: Image scan
    runs-on: [self-hosted, Linux, X64, debian]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Docker build
        run: make docker-build

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hookway:local
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload vulnerability scan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      - name: Upload SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-core

      - name: Vulnerability scan (replay)
        # Scan the replay image even when core's scan found something.
        if: success() || failure()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: hookway-replay:local
          format: sarif
          output: trivy-replay-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          limit-severities-for-sarif: true

      - name: Upload replay vulnerability scan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-replay-results
          path: trivy-replay-results.sarif
          if-no-files-found: error

      - name: Upload replay SARIF to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-replay-results.sarif
          category: trivy-replay
